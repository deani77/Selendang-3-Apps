name: iOS simulator build
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'test-data/**'
      - 'scripts/check-ios.py'
      - 'scripts/*crop-history.py'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: iOS build and checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Run iOS source checks
        run: python3 scripts/check-ios.py
      - name: Build for iOS Simulator
        run: xcodebuild -project ios/Selendang3.xcodeproj -scheme Selendang3 -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
