name: OSV dependency vulnerability scan

on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/gradle.lockfile'
      - '**/package-lock.json'
      - '**/pnpm-lock.yaml'
      - '**/yarn.lock'
      - '.github/workflows/osv-scanner.yml'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
